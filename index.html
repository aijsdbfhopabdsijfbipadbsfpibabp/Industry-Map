<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf2f6">
  <meta name="color-scheme" content="light">
  <title>業界地図</title>
  <meta name="description" content="自分用の業界地図。業界ごとの企業規模・資本関係を図でざっくり見る。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="業界地図">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <header class="appbar">
    <button class="icon-btn" id="menuBtn" type="button" aria-label="業界の一覧と検索" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="./" aria-label="業界地図 トップ">
      <img src="assets/icons/icon.svg" alt="" width="26" height="26">
      <span>業界地図</span>
    </a>
    <div class="region" role="group" aria-label="表示する地域">
      <button type="button" data-region="jp" aria-pressed="true">日本</button>
      <button type="button" data-region="world" aria-pressed="false">世界</button>
    </div>
  </header>

  <nav class="tabs" id="sectorTabs" aria-label="業界"></nav>

  <main id="main" class="main">
    <section id="hero" class="hero" aria-live="polite"></section>
    <div id="viewSwitch" class="seg seg-views" role="tablist" aria-label="表示の切り替え"></div>
    <section id="view" class="view"></section>
    <footer class="foot">
      数値は各社の決算資料・報道をもとにした概算です。最新の情報は各社IRでご確認ください。
    </footer>
  </main>

  <aside class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheetTitle" role="dialog"></aside>

  <div class="backdrop backdrop-drawer" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="業界の一覧">
    <div class="drawer-head">
      <h2>業界をさがす</h2>
      <button class="icon-btn" type="button" id="drawerClose" aria-label="閉じる">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="search" placeholder="業界・企業・ブランド名で検索" autocomplete="off" enterkeyhint="search">
    </label>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <script>
    // HTMLファイルを直接開いた場合（file://）はデータを読み込めないので案内を出す
    if (location.protocol === 'file:') {
      document.getElementById('view').innerHTML =
        '<div class="error"><b>データを表示できませんでした</b>HTMLファイルを直接開くとデータを読み込めません。' +
        'GitHub Pages で開くか、このフォルダで <code>python3 -m http.server</code> を実行して ' +
        '<code>http://localhost:8000</code> を開いてください。</div>';
    }
  </script>
</body>
</html>
